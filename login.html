<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Healthcare Chatbot</title>
<style> body {
background: #f4f7fb; margin: 0;
 
font-family: Arial, sans-serif;
}
.container {
max-width: 400px; margin: 80px auto; padding: 25px; background: white; border-radius: 12px;
box-shadow: 0 3px 12px rgba(0,0,0,0.1); text-align: center;
}

h2 {
color: #4a90e2; margin-bottom: 20px;
}
input { width: 90%;
padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
}

button { width: 95%;
padding: 12px; background: #4a90e2; color: white;
border: none; cursor: pointer; border-radius: 8px; font-size: 16px;
}
button:hover { opacity: 0.85;
}

p {
margin-top: 15px; color: #333;
}
a {
color: #4a90e2;	
 
text-decoration: none; font-weight: bold;
}

a:hover {
text-decoration: underline;
}
.error { color: red;
margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
<h2>🔐 Login</h2>
<form method="POST">
<input type="text" name="username" placeholder="Enter username" required>
<input type="password" name="password" placeholder="Enter password" required>
<button type="submit">Login</button>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<p>Don't have an account? <a href="/register">Register here</a></p>
</div>

</body>
</html>
